<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phishing Detection</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input[type=text] { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        input[type=submit] { background-color: #007BFF; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .result { padding: 15px; margin-top: 20px; border-radius: 4px; }
        .safe { background-color: #d4edda; color: #155724; }
        .phishing { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Phishing Website Detector 🎣</h2>
        <p>Enter a URL to check if it's suspicious. (This is a PBL demo)</p>
        <form action="/predict" method="post">
            <label for="url">URL to Check:</label>
            <input type="text" id="url" name="url" placeholder="e.g., http://google.com" required>
            <input type="submit" value="Check URL">
        </form>

        {% if prediction_text %}
            <div class="result {{ 'safe' if 'Legitimate' in prediction_text else 'phishing' }}">
                <h3>Result: {{ prediction_text }}</h3>
                <p><strong>Checked URL:</strong> {{ url }}</p>
                <p><strong>Disclaimer:</strong> {{ disclaimer }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
